name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create or update a GitHub Release with the built artifacts
        type: boolean
        default: false
      tag:
        description: Release tag (required when create_release is true, e.g. v0.1.0)
        type: string
        required: false
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync xvfb ninja-build libgtk-3-dev

      - name: Build the AppImage
        env:
          APPIMAGE_OWNER: ${{ github.repository_owner }}
          APPIMAGE_REPO: ${{ github.event.repository.name }}
        run: packaging/appimage/build_appimage.sh

      - name: Verify the checksum sidecar
        run: (cd build/appimage && sha256sum -c FreeCADLauncher-*.AppImage.sha256)

      - name: Smoke-test the AppImage
        run: xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 build/appimage/FreeCADLauncher-*-x86_64.AppImage --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          retention-days: 30
          if-no-files-found: error
          path: |
            build/appimage/FreeCADLauncher-*.AppImage
            build/appimage/FreeCADLauncher-*.AppImage.sha256
            build/appimage/FreeCADLauncher-*.AppImage.zsync

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Check version consistency
        shell: bash
        run: bash packaging/check_version.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Build the Windows bundle
        run: flutter build windows --release

      - name: Check Windows version metadata
        shell: pwsh
        run: ./packaging/windows/check_version_info.ps1

      - name: Assemble the portable zip
        shell: pwsh
        run: ./packaging/windows/build_portable.ps1

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $exe = (Get-Item 'build\windows\portable\FreeCADLauncher-*-windows-x86_64\freecad_launcher.exe').FullName
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'freecad_launcher.exe --version timed out'
          }
          if ($process.ExitCode -ne 0) {
            throw "freecad_launcher.exe --version exited with $($process.ExitCode)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          retention-days: 30
          if-no-files-found: error
          path: |
            build/windows/FreeCADLauncher-*-windows-x86_64.zip
            build/windows/FreeCADLauncher-*-windows-x86_64.zip.sha256

  publish:
    needs: [appimage, windows]
    if: ${{ inputs.create_release || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*'
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "error: release tag '$tag' must look like vX.Y.Z" >&2
            exit 1
          fi
          version="$(sed -n "s/^const String appVersion = '\(.*\)';/\1/p" lib/core/constants.dart)"
          if [[ "$tag" != "v$version" ]]; then
            echo "error: tag $tag does not match app version v$version" >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(release-assets/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "error: no release assets were downloaded" >&2
            exit 1
          fi
          ls -l "${assets[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            args=(--title "FreeCAD Launcher $version" --generate-notes --target "$GITHUB_SHA")
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$INPUT_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" "${args[@]}" "${assets[@]}"
          fi
