name: Release AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync

      - name: Build the AppImage
        env:
          APPIMAGE_OWNER: ${{ github.repository_owner }}
          APPIMAGE_REPO: ${{ github.event.repository.name }}
        run: packaging/appimage/build_appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            build/appimage/FreeCADLauncher-*.AppImage
            build/appimage/FreeCADLauncher-*.AppImage.sha256
            build/appimage/FreeCADLauncher-*.AppImage.zsync
