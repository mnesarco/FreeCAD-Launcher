name: CI

on:
  push:
    branches: [devel, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true

      - name: Check version consistency
        shell: bash
        run: bash packaging/check_version.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check generated files are current
        shell: bash
        run: git diff --exit-code -- 'lib/**/*.g.dart' 'lib/l10n/gen'

      - name: Check third-party notices are current
        if: runner.os == 'Linux'
        run: |
          dart run tool/generate_third_party_notices.dart
          git diff --exit-code THIRD_PARTY_NOTICES.md

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: flutter build macos --release --no-codesign
